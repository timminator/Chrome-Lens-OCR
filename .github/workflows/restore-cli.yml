name: Restore CLI entrypoint

on:
  push:
    branches: [protobuf-migration]

permissions:
  contents: write

jobs:
  restore:
    if: github.event.head_commit.message != 'Restore chrome_lens_ocr.py and add Nuitka protobuf inclusion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore entrypoint from main
        run: |
          git fetch origin main
          git checkout origin/main -- chrome_lens_ocr.py
          python - <<'PY'
          from pathlib import Path
          path = Path('chrome_lens_ocr.py')
          text = path.read_text()
          directive = '# nuitka-project: --include-package=chrome_lens_ocr.utils.protobufs\n'
          if directive not in text:
              lines = text.splitlines(keepends=True)
              lines.insert(2, directive)
              path.write_text(''.join(lines))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add chrome_lens_ocr.py
          git commit -m 'Restore chrome_lens_ocr.py and add Nuitka protobuf inclusion'
          git push origin HEAD:protobuf-migration
